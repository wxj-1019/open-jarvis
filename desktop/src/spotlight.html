<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-app-region: no-drag;
    user-select: none;
  }

  .spotlight {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 16px 24px;
  }

  .spotlight-card {
    width: 100%; max-width: 580px;
    background: rgba(30, 30, 30, 0.92);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  .spotlight-icon {
    width: 20px; height: 20px;
    flex-shrink: 0;
    opacity: 0.5;
    color: #999;
  }

  .spotlight-icon svg {
    width: 100%; height: 100%;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  .spotlight-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #f0f0f0;
    font-size: 17px;
    line-height: 1.4;
    caret-color: #6c8cff;
  }

  .spotlight-input::placeholder {
    color: rgba(255, 255, 255, 0.35);
  }

  .spotlight-hint {
    flex-shrink: 0;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.3);
    padding: 3px 8px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 5px;
    letter-spacing: 0.5px;
  }

  .spotlight-status {
    width: 100%; max-width: 580px;
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.3);
    min-height: 16px;
  }
</style>
</head>
<body>
<div class="spotlight">
  <div style="display:flex;flex-direction:column;align-items:center;width:100%">
    <div class="spotlight-card">
      <div class="spotlight-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
      </div>
      <input
        id="spotlight-input"
        class="spotlight-input"
        type="text"
        placeholder="Type a message..."
        autofocus
      />
      <span class="spotlight-hint">Enter</span>
    </div>
    <div id="spotlight-status" class="spotlight-status"></div>
  </div>
</div>

<script>
(function () {
  var input = document.getElementById('spotlight-input');
  var statusEl = document.getElementById('spotlight-status');
  var _submitted = false;

  if (!window.hana || typeof window.hana.submitSpotlight !== 'function') {
    statusEl.textContent = 'IPC not available';
    return;
  }

  input.focus();

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (_submitted) return;
      var text = input.value.trim();
      if (!text) {
        window.close();
        return;
      }
      _submitted = true;
      input.disabled = true;
      statusEl.textContent = 'Sending...';
      try {
        window.hana.submitSpotlight(text);
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        _submitted = false;
        input.disabled = false;
        return;
      }
      // Window will be hidden by main process after receiving the IPC
      setTimeout(function () {
        try { window.close(); } catch (_) {}
      }, 100);
    } else if (e.key === 'Escape') {
      window.close();
    }
  });

  // Allow clicking outside input to close (via blur on window in main process)
})();
</script>
</body>
</html>
