<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.connected { background: #4caf50; }
    .dot.disconnected { background: #f44336; }
    .label { font-weight: 500; }
    #info { color: #666; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span class="label" id="statusText">Connecting...</span>
  </div>
  <div id="info"></div>
  <script src="popup.js"></script>
</body>
</html>
